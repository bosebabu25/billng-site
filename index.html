<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>5Petal_India - Billing</title>
<style>
:root{
  --bg:#faf7f2; --card:#fff; --text:#2b1d14; --sub:#6b5a4d; --accent:#8a5a34;
  --accent2:#c98a4b; --border:#e6dcd0; --danger:#b3452f;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{margin:0;background:var(--bg);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;}
header{padding:16px 20px;background:var(--accent);color:#fff;text-align:center;position:sticky;top:0;z-index:10;padding-top:calc(16px + env(safe-area-inset-top,0px));}
header h1{margin:0;font-size:1.4rem;letter-spacing:.5px;}
header p{margin:2px 0 0;font-size:.8rem;opacity:.9;}
.tabs{display:flex;justify-content:center;gap:8px;margin:14px 10px;flex-wrap:wrap;}
.tabs button{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 16px;border-radius:20px;cursor:pointer;font-size:.9rem;}
.tabs button.active{background:var(--accent);color:#fff;border-color:var(--accent);}
.wrap{max-width:720px;margin:0 auto;padding:0 14px 40px;}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px;margin-bottom:16px;}
.card h2{margin:0 0 10px;font-size:1.05rem;color:var(--accent);}
.row{display:flex;gap:8px;margin-bottom:8px;flex-wrap:wrap;}
.row>*{flex:1;min-width:90px;}
input,select{width:100%;padding:8px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:.9rem;}
label.small{font-size:.75rem;color:var(--sub);display:block;margin-bottom:3px;}
button.btn{background:var(--accent);color:#fff;border:none;padding:10px 14px;border-radius:8px;cursor:pointer;font-size:.9rem;}
button.btn.secondary{background:transparent;color:var(--accent);border:1px solid var(--accent);}
button.btn.danger{background:var(--danger);}
table{width:100%;border-collapse:collapse;font-size:.85rem;}
th,td{border-bottom:1px solid var(--border);padding:6px 4px;text-align:left;}
.totals div{display:flex;justify-content:space-between;padding:3px 0;font-size:.92rem;}
.totals .grand{font-weight:700;font-size:1.1rem;color:var(--accent);border-top:1px solid var(--border);margin-top:6px;padding-top:8px;}
.item-header{display:flex;gap:6px;font-size:.72rem;color:var(--sub);margin-bottom:4px;padding:0 2px;}
.item-header .col-item{flex:2;}
.item-header .col-qty{flex:1;}
.item-header .col-price{flex:1;}
.item-header .col-x{flex:0 0 30px;}
.itemline{display:flex;gap:6px;align-items:flex-start;margin-bottom:8px;}
.itemline .col-item{flex:2;}
.itemline .col-qty{flex:1;}
.itemline .col-price{flex:1;}
.itemline .rm{background:var(--danger);color:#fff;border:none;border-radius:6px;padding:8px 10px;cursor:pointer;flex:0 0 30px;}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.hist-empty{color:var(--sub);font-size:.85rem;text-align:center;padding:20px 0;}

/* Preview overlay */
#previewOverlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:100;align-items:flex-start;justify-content:center;overflow-y:auto;padding:20px 12px;}
#previewOverlay .sheet{background:#fff;color:#111;max-width:420px;width:100%;border-radius:10px;padding:18px;margin-top:10px;}
.bp-head{text-align:center;margin-bottom:8px;}
.bp-head h2{margin:0;}
.bp-head small{color:#555;}
.bp-table{width:100%;border-collapse:collapse;margin:10px 0;}
.bp-table th,.bp-table td{border-bottom:1px dashed #999;padding:4px;font-size:.85rem;}
.bp-total div{display:flex;justify-content:space-between;font-size:.9rem;padding:2px 0;}
.preview-toolbar{display:flex;gap:8px;margin-top:16px;}
.preview-toolbar button{flex:1;padding:10px;border-radius:8px;border:none;cursor:pointer;font-size:.9rem;}
.pt-print{background:var(--accent);color:#fff;}
.pt-close{background:#eee;color:#333;}

@media print{
  @page{ margin:10mm; }
  body *{visibility:hidden;}
  #previewOverlay, #previewOverlay *{visibility:visible;}
  #previewOverlay{position:absolute;inset:auto;background:none;display:block !important;padding:0;}
  #previewOverlay .sheet{box-shadow:none;max-width:100%;margin:0;page-break-inside:avoid;}
  .no-print{display:none !important;}
}
</style>
</head>
<body oncontextmenu="return false">
<header>
  <h1>🌸 5Petal_India</h1>
  <p>Cafe &amp; Restaurant Billing</p>
</header>

<div class="tabs">
  <button class="active" data-tab="bill">New Bill</button>
  <button data-tab="history">Sales History</button>
</div>

<div class="wrap">

  <!-- NEW BILL TAB -->
  <div id="tab-bill">
    <div class="card">
      <h2>Customer Details</h2>
      <div class="row">
        <input id="custName" placeholder="Customer name (optional)">
        <input id="custPhone" placeholder="Phone (optional)">
      </div>
    </div>

    <div class="card">
      <h2>Items</h2>
      <div class="item-header">
        <span class="col-item">Item</span>
        <span class="col-qty">Quantity</span>
        <span class="col-price">Price</span>
        <span class="col-x"></span>
      </div>
      <div id="itemList"></div>
      <button class="btn secondary" onclick="addItem()">+ Add Item</button>
    </div>

    <div class="card">
      <h2>Charges</h2>
      <div class="row">
        <div>
          <label class="small">GST %</label>
          <input type="number" id="gstPct" value="5" min="0" step="0.1">
        </div>
        <div>
          <label class="small">Discount %</label>
          <input type="number" id="discPct" value="0" min="0" step="0.1">
        </div>
      </div>
      <div class="totals" id="totalsBox"></div>
    </div>

    <div class="actions">
      <button class="btn" onclick="previewBill()">Preview Bill</button>
    </div>
  </div>

  <!-- HISTORY TAB -->
  <div id="tab-history" style="display:none;">

    <!-- Admin login gate -->
    <div class="card" id="histLoginCard">
      <h2>🔒 Admin Login</h2>
      <div class="row">
        <input type="password" id="adminPass" placeholder="Admin password — admin123" onkeydown="if(event.key==='Enter')adminLogin()">
      </div>
      <p id="loginError" style="color:var(--danger);font-size:.8rem;display:none;margin:0 0 8px;">Incorrect password. Try again.</p>
      <div class="actions">
        <button class="btn" onclick="adminLogin()">Login</button>
        <button class="btn secondary" onclick="goToBill()">← Back</button>
      </div>
    </div>

    <!-- Sales history content (shown after login) -->
    <div class="card" id="histContentCard" style="display:none;">
      <h2>Sales Log (stored on this device)</h2>
      <div id="histBox"></div>
      <div class="actions">
        <button class="btn secondary" onclick="exportCSV()">Export Sales (CSV for Excel/Sheets)</button>
        <button class="btn danger" onclick="clearHistory()">Clear Log</button>
        <button class="btn secondary" onclick="logoutAdmin()">Logout</button>
        <button class="btn secondary" onclick="goToBill()">← Back</button>
      </div>
    </div>

    <!-- Best selling items (shown after login) -->
    <div class="card" id="bestSellersCard" style="display:none;">
      <h2>🏆 Best Selling Items</h2>
      <div id="bestSellersBox"></div>
    </div>

  </div>

</div>

<!-- PRINT PREVIEW OVERLAY -->
<div id="previewOverlay">
  <div class="sheet">
    <div class="bp-head">
      <h2>5Petal_India</h2>
      <small>Cafe &amp; Restaurant</small><br>
      <small id="bpMeta"></small>
    </div>
    <div id="bpCustomer" style="font-size:.85rem;margin-bottom:6px;"></div>
    <table class="bp-table">
      <thead><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr></thead>
      <tbody id="bpItems"></tbody>
    </table>
    <div class="bp-total" id="bpTotals"></div>
    <p style="text-align:center;font-size:.8rem;margin-top:10px;">Thank you for visiting 5Petal_India!</p>
    <div class="preview-toolbar no-print">
      <button class="pt-print" onclick="handlePrintClick()">🖨 Print</button>
      <button class="pt-close" onclick="closePreview()">✕ Close</button>
    </div>
  </div>
</div>

<script>
// Fixed-price menu — edit this list to match your actual cafe menu & prices
const MENU = [
  {name:'Cappuccino', price:80},
  {name:'Cafe Latte', price:90},
  {name:'Espresso', price:70},
  {name:'Cold Coffee', price:100},
  {name:'Masala Chai', price:40},
  {name:'Veg Sandwich', price:120},
  {name:'Grilled Sandwich', price:150},
  {name:'Pasta', price:180}
];

let items = [];
let billCounter = loadCounter();
let currentBillDraft = null;
let reprintMode = false;

function loadStore(){
  try{ const s = localStorage.getItem('5petal_sales'); return s ? JSON.parse(s) : []; }catch(e){ return []; }
}
function saveStore(list){ try{ localStorage.setItem('5petal_sales', JSON.stringify(list)); }catch(e){} }
function loadCounter(){ try{ return parseInt(localStorage.getItem('5petal_counter')||'1',10); }catch(e){ return 1; } }
function saveCounter(n){ try{ localStorage.setItem('5petal_counter', String(n)); }catch(e){} }

function addItem(){
  const id = Date.now()+Math.random();
  const first = MENU[0];
  items.push({id, name:first.name, qty:1, price:first.price, isCustom:false});
  renderItems();
}
function removeItem(id){
  items = items.filter(i=>String(i.id)!==String(id));
  renderItems();
}
function onItemSelect(id, value){
  const it = items.find(i=>String(i.id)===String(id));
  if(!it) return;
  if(value === '__custom__'){
    it.isCustom = true; it.name=''; it.price=0;
  } else {
    it.isCustom = false;
    const m = MENU.find(mm=>mm.name===value);
    it.name = value;
    it.price = m ? m.price : 0;
  }
  renderItems();
}
function updateItem(id, field, val){
  const it = items.find(i=>String(i.id)===String(id));
  if(!it) return;
  it[field] = (field==='qty'||field==='price') ? (parseFloat(val)||0) : val;
  renderTotals();
}
function renderItems(){
  const box = document.getElementById('itemList');
  box.innerHTML = '';
  items.forEach(it=>{
    const options = MENU.map(m=>`<option value="${m.name}" ${(!it.isCustom && it.name===m.name)?'selected':''}>${m.name} (₹${m.price})</option>`).join('');
    const div = document.createElement('div');
    div.className='itemline';
    div.innerHTML = `
      <div class="col-item">
        <select onchange="onItemSelect('${it.id}', this.value)">
          ${options}
          <option value="__custom__" ${it.isCustom?'selected':''}>Other (custom item)</option>
        </select>
        ${it.isCustom ? `<input type="text" placeholder="Custom item name" value="${it.name}" style="margin-top:6px;" oninput="updateItem('${it.id}','name',this.value)">` : ''}
      </div>
      <div class="col-qty"><input type="number" min="1" value="${it.qty}" oninput="updateItem('${it.id}','qty',this.value)"></div>
      <div class="col-price"><input type="number" min="0" value="${it.price}" ${it.isCustom?'':'title="Auto-filled from menu, editable"'} oninput="updateItem('${it.id}','price',this.value)"></div>
      <button class="rm" onclick="removeItem('${it.id}')">✕</button>`;
    box.appendChild(div);
  });
  renderTotals();
}
function computeTotals(){
  const subtotal = items.reduce((s,i)=>s+(i.qty*i.price),0);
  const discPct = parseFloat(document.getElementById('discPct').value)||0;
  const gstPct = parseFloat(document.getElementById('gstPct').value)||0;
  const discAmt = subtotal*discPct/100;
  const afterDisc = subtotal-discAmt;
  const gstAmt = afterDisc*gstPct/100;
  const grand = afterDisc+gstAmt;
  return {subtotal, discPct, discAmt, gstPct, gstAmt, grand};
}
function renderTotals(){
  const t = computeTotals();
  document.getElementById('totalsBox').innerHTML = `
    <div><span>Subtotal</span><span>₹${t.subtotal.toFixed(2)}</span></div>
    <div><span>Discount (${t.discPct}%)</span><span>-₹${t.discAmt.toFixed(2)}</span></div>
    <div><span>GST (${t.gstPct}%)</span><span>+₹${t.gstAmt.toFixed(2)}</span></div>
    <div class="grand"><span>Grand Total</span><span>₹${t.grand.toFixed(2)}</span></div>`;
}
document.getElementById('gstPct').addEventListener('input', renderTotals);
document.getElementById('discPct').addEventListener('input', renderTotals);

function previewBill(){
  const valid = items.filter(i=>i.name && i.name.trim() && i.qty>0);
  if(valid.length===0){ alert('Please add at least one item with a name and quantity.'); return; }
  reprintMode = false;
  const t = computeTotals();
  const now = new Date();
  const billNo = 'B' + String(billCounter).padStart(4,'0');
  currentBillDraft = {valid, t, billNo, now};

  document.getElementById('bpMeta').textContent = `Bill No: ${billNo}  |  ${now.toLocaleString()}`;
  const cn = document.getElementById('custName').value.trim();
  const cp = document.getElementById('custPhone').value.trim();
  document.getElementById('bpCustomer').textContent = (cn||cp) ? `Customer: ${cn||'-'}  ${cp?('| '+cp):''}` : '';
  document.getElementById('bpItems').innerHTML = valid.map(i=>
    `<tr><td>${i.name}</td><td>${i.qty}</td><td>₹${i.price.toFixed(2)}</td><td>₹${(i.qty*i.price).toFixed(2)}</td></tr>`).join('');
  document.getElementById('bpTotals').innerHTML = `
    <div><span>Subtotal</span><span>₹${t.subtotal.toFixed(2)}</span></div>
    <div><span>Discount (${t.discPct}%)</span><span>-₹${t.discAmt.toFixed(2)}</span></div>
    <div><span>GST (${t.gstPct}%)</span><span>+₹${t.gstAmt.toFixed(2)}</span></div>
    <div style="font-weight:700;border-top:1px solid #333;margin-top:4px;padding-top:4px;"><span>Grand Total</span><span>₹${t.grand.toFixed(2)}</span></div>`;

  document.getElementById('previewOverlay').style.display = 'flex';
}
function handlePrintClick(){
  if(reprintMode){
    window.print();
  } else {
    confirmPrintBill();
  }
}
function reprintBill(billNo){
  const store = loadStore();
  const lines = store.filter(r=>r.billNo===billNo);
  if(lines.length===0){ alert('No saved data found for this bill.'); return; }
  const first = lines[0];
  const subtotal = lines.reduce((s,r)=>s+(r.qty*r.price),0);
  const discPct = parseFloat(first.discPct)||0;
  const gstPct = parseFloat(first.gstPct)||0;
  const discAmt = subtotal*discPct/100;
  const afterDisc = subtotal-discAmt;
  const gstAmt = afterDisc*gstPct/100;
  const grand = parseFloat(first.grandTotal);

  reprintMode = true;
  currentBillDraft = null;
  document.getElementById('bpMeta').textContent = `Bill No: ${billNo}  |  ${new Date(first.date).toLocaleString()}  (Reprint)`;
  const cn = first.customer, cp = first.phone;
  document.getElementById('bpCustomer').textContent = (cn||cp) ? `Customer: ${cn||'-'}  ${cp?('| '+cp):''}` : '';
  document.getElementById('bpItems').innerHTML = lines.map(r=>
    `<tr><td>${r.item}</td><td>${r.qty}</td><td>₹${parseFloat(r.price).toFixed(2)}</td><td>₹${(r.qty*r.price).toFixed(2)}</td></tr>`).join('');
  document.getElementById('bpTotals').innerHTML = `
    <div><span>Subtotal</span><span>₹${subtotal.toFixed(2)}</span></div>
    <div><span>Discount (${discPct}%)</span><span>-₹${discAmt.toFixed(2)}</span></div>
    <div><span>GST (${gstPct}%)</span><span>+₹${gstAmt.toFixed(2)}</span></div>
    <div style="font-weight:700;border-top:1px solid #333;margin-top:4px;padding-top:4px;"><span>Grand Total</span><span>₹${grand.toFixed(2)}</span></div>`;

  document.getElementById('previewOverlay').style.display = 'flex';
}
function closePreview(){
  document.getElementById('previewOverlay').style.display = 'none';
  reprintMode = false;
}
function confirmPrintBill(){
  if(!currentBillDraft) return;
  const {valid, t, billNo, now} = currentBillDraft;
  const cn = document.getElementById('custName').value.trim();
  const cp = document.getElementById('custPhone').value.trim();

  const store = loadStore();
  valid.forEach(i=>{
    store.push({
      date: now.toISOString(), billNo, customer: cn, phone: cp,
      item: i.name, qty: i.qty, price: i.price, lineTotal: (i.qty*i.price).toFixed(2),
      discPct: t.discPct, gstPct: t.gstPct, grandTotal: t.grand.toFixed(2)
    });
  });
  saveStore(store);
  billCounter++; saveCounter(billCounter);

  window.print();
  renderHistory();
}

function renderHistory(){
  const store = loadStore();
  const box = document.getElementById('histBox');
  if(store.length===0){ box.innerHTML = '<p class="hist-empty">No sales recorded yet.</p>'; return; }

  // Group line items by unique billing ID (billNo) into one row per bill
  const groups = {};
  const order = [];
  store.forEach(r=>{
    if(!groups[r.billNo]){
      groups[r.billNo] = {
        billNo: r.billNo, date: r.date, customer: r.customer, phone: r.phone,
        itemsDesc: [], price: 0, discPct: r.discPct, gstPct: r.gstPct, grandTotal: r.grandTotal
      };
      order.push(r.billNo);
    }
    const g = groups[r.billNo];
    g.itemsDesc.push(`${r.item} x${r.qty}`);
    g.price += (r.qty * r.price);
  });
  const bills = order.map(id=>groups[id]).reverse().slice(0,100);

  let rows = bills.map(g=>`
    <tr><td>${new Date(g.date).toLocaleString()}</td><td>${g.billNo}</td><td>${g.customer||'-'}</td><td>${g.phone||'-'}</td><td>${g.itemsDesc.join(', ')}</td><td>₹${g.price.toFixed(2)}</td><td>${g.discPct}%</td><td>${g.gstPct}%</td><td>₹${g.grandTotal}</td><td><button class="btn secondary" onclick="reprintBill('${g.billNo}')">🖨 Print</button></td></tr>`).join('');
  box.innerHTML = `<div style="overflow-x:auto;"><table>
    <thead><tr><th>Date/Time</th><th>Bill#</th><th>Customer</th><th>Phone</th><th>Items</th><th>Price</th><th>Discount%</th><th>GST%</th><th>Bill Total</th><th>Print</th></tr></thead>
    <tbody>${rows}</tbody></table></div>
    <p style="font-size:.75rem;color:var(--sub);margin-top:8px;">Showing latest ${Math.min(100,order.length)} of ${order.length} bills.</p>`;
}
function renderBestSellers(){
  const store = loadStore();
  const box = document.getElementById('bestSellersBox');
  if(store.length===0){ box.innerHTML = '<p class="hist-empty">No sales recorded yet.</p>'; return; }

  // For each order/bill ID, tally the quantity of each item, then sum across all orders
  const perItem = {};
  store.forEach(r=>{
    if(!perItem[r.item]) perItem[r.item] = {item:r.item, qty:0, billNos:[]};
    perItem[r.item].qty += r.qty;
    if(!perItem[r.item].billNos.includes(r.billNo)) perItem[r.item].billNos.push(r.billNo);
  });
  const ranked = Object.values(perItem).sort((a,b)=>b.qty-a.qty);

  let rows = ranked.map((r,idx)=>`
    <tr><td>${idx+1}</td><td>${r.item}</td><td>${r.qty}</td><td>${r.billNos.join(', ')}</td></tr>`).join('');
  box.innerHTML = `<div style="overflow-x:auto;"><table>
    <thead><tr><th>#</th><th>Item</th><th>Total Qty Sold</th><th>Billing ID</th></tr></thead>
    <tbody>${rows}</tbody></table></div>`;
}
function exportCSV(){
  const store = loadStore();
  if(store.length===0){ alert('No sales data to export yet.'); return; }
  const headers = ['Date','BillNo','Customer','Phone','Item','Qty','Price','LineTotal','Discount%','GST%','BillGrandTotal'];
  const rows = store.map(r=>[r.date,r.billNo,r.customer,r.phone,r.item,r.qty,r.price,r.lineTotal,r.discPct,r.gstPct,r.grandTotal]);
  let csv = headers.join(',') + '\n' + rows.map(r=>r.map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = '5Petal_India_sales_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
function clearHistory(){
  if(confirm('Clear all saved sales history from this device? This cannot be undone.')){
    saveStore([]); renderHistory();
  }
}

// --- Admin login for Sales History ---
// NOTE: this is a simple front-end gate for casual privacy (keeping staff/customers
// out of the sales log), not real security — anyone who reads the page source can
// see the password. Change ADMIN_PASSWORD below to whatever you like.
const ADMIN_PASSWORD = 'admin123';
let isAdminLoggedIn = false;

function showHistoryLogin(){
  document.getElementById('histLoginCard').style.display = 'block';
  document.getElementById('histContentCard').style.display = 'none';
  document.getElementById('bestSellersCard').style.display = 'none';
  document.getElementById('loginError').style.display = 'none';
  document.getElementById('adminPass').value = '';
}
function showHistoryContent(){
  document.getElementById('histLoginCard').style.display = 'none';
  document.getElementById('histContentCard').style.display = 'block';
  document.getElementById('bestSellersCard').style.display = 'block';
  renderHistory();
  renderBestSellers();
}
function adminLogin(){
  const val = document.getElementById('adminPass').value;
  if(val === ADMIN_PASSWORD){
    isAdminLoggedIn = true;
    showHistoryContent();
  } else {
    document.getElementById('loginError').style.display = 'block';
  }
}
function logoutAdmin(){
  isAdminLoggedIn = false;
  showHistoryLogin();
}
function goToBill(){
  isAdminLoggedIn = false;
  document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
  document.querySelector('.tabs button[data-tab="bill"]').classList.add('active');
  document.getElementById('tab-bill').style.display = 'block';
  document.getElementById('tab-history').style.display = 'none';
  showHistoryLogin();
}

// Tabs
document.querySelectorAll('.tabs button').forEach(b=>{
  b.addEventListener('click', ()=>{
    const tab = b.dataset.tab;
    if(tab==='bill') isAdminLoggedIn = false;
    document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));
    b.classList.add('active');
    document.getElementById('tab-bill').style.display = tab==='bill' ? 'block':'none';
    document.getElementById('tab-history').style.display = tab==='history' ? 'block':'none';
    if(tab==='history'){
      if(isAdminLoggedIn) showHistoryContent(); else showHistoryLogin();
    } else {
      showHistoryLogin();
    }
  });
});

// init
addItem();
renderHistory();
</script>
</body>
